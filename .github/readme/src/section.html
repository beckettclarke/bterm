<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://beckettclarke.github.io/resources/fonts/satoshi/import.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="banner.css">
<style>
  .b { width: 1200px; height: 170px; padding: 26px 46px 0; }
  .row { display: flex; justify-content: space-between; }
  .main { display: flex; align-items: center; justify-content: space-between; gap: 40px; margin-top: 14px; }
  .t { display: flex; align-items: center; gap: 22px; }
  .t img { width: 70px; height: 70px; transform: scale(1.2); }
  h2 { margin: 0; font-size: 62px; line-height: 1; letter-spacing: -.04em; font-weight: 700; }
  p { margin: 0; max-width: 430px; font-size: 21px; line-height: 1.3; color: var(--dim); text-align: right; }
  .glow { right: -200px; bottom: -260px; width: 700px; height: 420px; opacity: .7; }
</style>
<div class="b">
  <div class="glow"></div>
  <div class="row"><span class="label" id="kicker"></span><span class="label" id="tags"></span></div>
  <div class="main">
    <div class="t"><img src="../../../site/assets/img/icon-512.png"><h2 id="title"></h2></div>
    <p id="text"></p>
  </div>
</div>
<script>
  // section.html#01|Install|Text on the right|TAG · TAG
  const [n, title, text, tags] = decodeURIComponent(location.hash.slice(1)).split('|');
  document.getElementById('kicker').innerHTML = `<span class="n">${n}</span><span class="sep">/</span>${title}`;
  document.getElementById('title').textContent = title;
  document.getElementById('text').textContent = text;
  document.getElementById('tags').innerHTML = (tags || '').split('·').map((t) => t.trim()).join('<span class="sep">·</span>');
</script>
